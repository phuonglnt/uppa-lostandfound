services:
  mysql:
    image: mysql:8.0
    container_name: uppa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin_password
      MYSQL_DATABASE: lostandfound
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uppa_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    command: npm run start:dev
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: admin_password
      DB_NAME: lostandfound
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: